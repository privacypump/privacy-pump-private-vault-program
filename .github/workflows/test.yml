name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - run: node scripts/policy-scan.mjs
      - run: node scripts/docs-check.mjs
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets
      - run: cargo test
