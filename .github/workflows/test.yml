name: Test
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: node scripts/policy-scan.mjs
      - run: node scripts/docs-check.mjs
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets
      - run: cargo test
