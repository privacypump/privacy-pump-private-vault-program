name: Feature request
description: Propose a public-safe improvement.
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: outcome
    attributes:
      label: Desired outcome
      description: Explain the user or integrator need.
    validations:
      required: true
  - type: textarea
    id: privacy
    attributes:
      label: Privacy and security impact
      description: Identify new metadata, trust, authorization, or fund-movement assumptions.
    validations:
      required: true
